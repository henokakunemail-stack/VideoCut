<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fe2c55"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#fe2c55" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="38" ry="38" fill="url(#bg)"/>

  <!-- Red accent arc / film strip top -->
  <rect x="10" y="10" width="180" height="52" rx="38" ry="38" fill="url(#accent)"/>
  <rect x="10" y="42" width="180" height="20" fill="url(#accent)"/>

  <!-- Film strip holes top -->
  <rect x="28" y="18" width="14" height="10" rx="3" fill="rgba(0,0,0,0.35)"/>
  <rect x="58" y="18" width="14" height="10" rx="3" fill="rgba(0,0,0,0.35)"/>
  <rect x="88" y="18" width="14" height="10" rx="3" fill="rgba(0,0,0,0.35)"/>
  <rect x="118" y="18" width="14" height="10" rx="3" fill="rgba(0,0,0,0.35)"/>
  <rect x="148" y="18" width="14" height="10" rx="3" fill="rgba(0,0,0,0.35)"/>

  <!-- Film strip holes bottom -->
  <rect x="28" y="172" width="14" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="58" y="172" width="14" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="88" y="172" width="14" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="118" y="172" width="14" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>
  <rect x="148" y="172" width="14" height="10" rx="3" fill="rgba(255,255,255,0.12)"/>

  <!-- Bottom film strip bar -->
  <rect x="10" y="158" width="180" height="32" rx="0" fill="rgba(255,255,255,0.06)"/>
  <rect x="10" y="168" width="180" height="22" rx="0" fill="rgba(255,255,255,0.04)"/>

  <!-- Play button circle -->
  <circle cx="100" cy="112" r="40" fill="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <circle cx="100" cy="112" r="36" fill="rgba(254,44,85,0.18)" stroke="url(#accent)" stroke-width="2.5"/>

  <!-- Play triangle -->
  <polygon points="90,96 90,128 122,112" fill="url(#play)" filter="url(#glow)"/>

  <!-- "V" cut notch on play triangle (scissor aesthetic) -->
  <polygon points="90,96 90,128 122,112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

</svg>
